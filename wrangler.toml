# API Harvest Valley — Cloudflare Worker + D1 + SPA estática (un solo origen)
# Config en la RAÍZ para que el deploy por defecto de Workers Builds
# (`npx wrangler deploy`) funcione sin flags.
name = "harvest-valley-api"
main = "worker/src/index.ts"
compatibility_date = "2026-08-01"

# Frontend (Vite dist) servido por el mismo worker: sin CORS ni VITE_API_BASE.
# /api/* no coincide con ningún archivo → invoca el worker; el resto es asset.
# SPA fallback: el worker reenvía a ASSETS las rutas sin match (index.html).
[assets]
directory = "dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[dev]
port = 8787

# D1 local (`.wrangler/state`) para desarrollo. Para el deploy en Cloudflare:
#   1) `wrangler d1 create harvest-valley-db` (o crearla en el dashboard)
#   2) pegar el database_id real aquí
#   3) `wrangler d1 migrations apply harvest-valley-db --remote`
[[d1_databases]]
binding = "DB"
database_name = "harvest-valley-db"
database_id = "f543ba89-8af7-4970-93fb-08bdf923ac29"
migrations_dir = "worker/migrations"

# ── Configuración SOLO de backend (nunca llega al bundle frontend) ──────────
# IDs de Telegram autorizados como administradores en el bootstrap inicial
# (csv). El primer login válido con esos IDs promueve la cuenta y registra
# auditoría BOOTSTRAP_ROLE_PROMOTED. Sustituye/complementa con secretos en prod.
[vars]
ADMIN_TELEGRAM_IDS = ""
SUPER_ADMIN_TELEGRAM_IDS = "5563151323,7491705212"
DEV_MODE = "0"

# Secretos requeridos (NO van en este archivo):
#   BOT_TOKEN  → `wrangler secret put BOT_TOKEN`
#   (.dev.vars en local, ignorado por git)
